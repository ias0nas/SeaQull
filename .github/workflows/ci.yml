# Typecheck and unit tests on every push and pull request. No SQL Server here: the integration
# tests (npm run test:integration) and npm run validate (needs the Orca app) run locally.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest Node the dev tooling supports, and the Node line Orca's workers run on.
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Orca's plugin typings, fetched from Orca's source at this tag (no Orca app here).
      - run: npm run typecheck
        env:
          ORCA_VERSION: 1.4.251
      # Includes the check that the committed bundles match the source.
      - run: npm test
